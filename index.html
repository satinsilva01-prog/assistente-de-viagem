<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/icon.png"><link rel="apple-touch-icon" href="assets/icon.png">
<title>Assistente de Viagem V35</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--text:#17202a;--muted:#667085;--line:#d9dee5;--green:#16a34a;--green2:#0b7a35;--danger:#dc2626;--warn:#d97706;--shadow:0 2px 9px #0001}
body.dark{--bg:#11151a;--card:#1a2027;--text:#f4f6f8;--muted:#aab3bd;--line:#343b44;--green:#16a34a;--green2:#0b7a35;--danger:#dc2626;--warn:#d97706;--shadow:0 2px 10px #0005;background:#11151a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);padding-top:64px;padding-bottom:82px}.hidden{display:none!important}
#av-trip-panel{position:sticky;top:64px;z-index:50;background:var(--bg);padding:2px 0 7px}.av-trip-panel-inner{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow);border:1px solid #ddd}.av-trip-panel-title{font-weight:800;text-align:center;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.av-expand-icon{font-size:15px;transition:transform .15s ease}.av-dashboard{display:grid;grid-template-columns:1fr 1fr;gap:9px}.av-box{background:#fff;border:1px solid #dfe4e8;border-radius:13px;padding:8px;min-width:0}.av-box-label{font-size:11px;color:#59636f;font-weight:800}.av-box-value{font-size:21px;font-weight:900;margin-top:4px;overflow-wrap:anywhere}.av-fuel-bars{display:grid;grid-template-columns:repeat(var(--fuel-bars-count,8),1fr);gap:3px;margin-top:8px}.av-fuel-bars span{height:8px;border-radius:3px;background:#aeb6bf;border:1px solid #89939e}.av-fuel-bars span.on{background:#16a34a;border-color:#0b7a35}.av-fuel-legend{display:flex;justify-content:space-between;font-size:11px;color:#59636f;margin-top:3px}
#av-trip-panel.vehicle-collapsed .av-dashboard{grid-template-columns:1fr 1fr;gap:7px}.vehicle-collapsed .av-box{padding:6px}.vehicle-collapsed .av-box-label{font-size:10px}.vehicle-collapsed .av-box-value{font-size:18px}.vehicle-collapsed .av-fuel-legend{display:none}.vehicle-collapsed .av-fuel-bars{margin-top:5px}.vehicle-collapsed .av-expand-icon{transform:rotate(-90deg)}
.av-compact-click{cursor:pointer}.av-compact-click:active{opacity:.75}
.card{background:var(--card);border:1px solid #d8dde3;border-radius:15px;box-shadow:var(--shadow);padding:13px;margin:10px 0}.card h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{min-height:67px;background:#fff;border:1px solid #d8dde3;border-radius:12px;padding:9px;display:flex;flex-direction:column;justify-content:center;min-width:0}.metric span{font-size:12px;color:#59636f}.metric b{font-size:17px;margin-top:4px;overflow-wrap:anywhere}.trip-destination-metric{cursor:pointer}
#av-fixed-header{position:fixed;z-index:1000;top:0;left:0;right:0;height:64px;background:#fff;display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid #ddd;box-shadow:0 2px 8px #0002}.av-menu-btn,.av-theme{border:0;background:transparent;font-size:28px;width:42px;height:42px;border-radius:10px}.av-title{font-size:20px;font-weight:800;flex:1;text-align:center}.av-gps{font-size:12px;padding:7px 9px;border:1px solid #d9dee5;border-radius:999px;background:#f7f8fa}
#av-trip-footer{position:fixed;z-index:999;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7dce2;box-shadow:0 -3px 12px #0002;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.av-action{border:1px solid #d0d6dc;background:#fff;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800}.av-action.primary{background:#16a34a;color:#fff;border-color:#16a34a}.av-action.danger{background:#dc2626;color:#fff!important;border-color:#dc2626}
body.dark #av-fixed-header,body.dark #av-trip-footer,body.dark .av-box,body.dark .av-trip-panel-inner{background:#1a2027;color:#f4f6f8;border-color:#343b44}body.dark .av-action{background:#20262d;color:#f4f6f8;border-color:#3b444e}body.dark .metric{background:#20262d;color:#f4f6f8}
@media(max-width:520px){.av-title{font-size:18px}.av-box-value{font-size:21px}.vehicle-collapsed .av-box-value{font-size:18px}}
</style>
</head>
<body>
<header id="av-fixed-header"><button class="av-menu-btn" type="button">☰</button><div class="av-title">Assistente de Viagem</div><div class="av-gps">GPS <span class="av-dot"></span></div></header>
<main>
<section id="av-trip-panel">
<div class="av-trip-panel-inner">
<div class="av-trip-panel-title" id="avVehiclePanelToggle" role="button" tabindex="0" aria-expanded="true">PAINEL DO VEÍCULO <span class="av-expand-icon">▼</span></div>
<div class="av-dashboard">
<div class="av-box av-compact-click" id="avFuelBox"><div class="av-box-label">COMBUSTÍVEL</div><div class="av-box-value" id="avFuelValue">0 L</div><div class="av-fuel-bars" id="avFuelBars"></div><div class="av-fuel-legend"><span>Vazio</span><span>Cheio</span></div></div>
<div class="av-box av-compact-click" id="avOdoBox"><div class="av-box-label">ODÔMETRO</div><div class="av-box-value" id="avOdoValue">0 km</div></div>
</div></div></section>
<section class="card"><h3>Viagens</h3><div class="grid"><div class="metric"><span>Status</span><b>Pronto</b></div><div class="metric"><span>Destino</span><b>—</b></div></div></section>
</main>
<footer id="av-trip-footer"><button class="av-action primary">▶ Iniciar viagem</button><button class="av-action">⏸ Pausa</button><button class="av-action danger">⏹ Terminar viagem</button><button class="av-action">🆕 Nova viagem</button></footer>
<script>
(function(){
 const panel=document.getElementById('av-trip-panel');
 const toggle=document.getElementById('avVehiclePanelToggle');
 const fuelBox=document.getElementById('avFuelBox');
 const odoBox=document.getElementById('avOdoBox');
 function setCollapsed(v){panel.classList.toggle('vehicle-collapsed',v);toggle.setAttribute('aria-expanded',String(!v));try{localStorage.setItem('av_vehicle_panel_collapsed',v?'1':'0')}catch(e){}}
 let collapsed=false;try{collapsed=localStorage.getItem('av_vehicle_panel_collapsed')==='1'}catch(e){} setCollapsed(collapsed);
 toggle.addEventListener('click',()=>setCollapsed(!panel.classList.contains('vehicle-collapsed')));
 toggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle.click()}});
 function openAdjustment(type){window.dispatchEvent(new CustomEvent('av-adjust-vehicle',{detail:{type}}));}
 fuelBox.addEventListener('click',e=>{if(panel.classList.contains('vehicle-collapsed'))return;openAdjustment('fuel')});
 odoBox.addEventListener('click',e=>{if(panel.classList.contains('vehicle-collapsed'))return;openAdjustment('odometer')});
 window.avSetFuelBars=function(count,on){const box=document.getElementById('avFuelBars');if(!box)return;count=Math.max(1,Number(count)||8);on=Math.max(0,Math.min(count,Number(on)||0));box.style.setProperty('--fuel-bars-count',count);box.innerHTML='';for(let i=0;i<count;i++){const s=document.createElement('span');if(i<on)s.className='on';box.appendChild(s)}};
 window.avSetFuelBars(8,0);
 window.avResetVehiclePanel=function(){setCollapsed(false);try{localStorage.removeItem('av_vehicle_panel_collapsed')}catch(e){}}
})();
</script>
</body></html>
