<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Assistente de Viagem V35</title><link rel="icon" href="assets/icon.png"><style>
:root{--bg:#eef1f4;--card:#fff;--text:#17202a;--muted:#667085;--green:#16a34a;--line:#d9dee5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding-top:64px;padding-bottom:82px}.hidden{display:none!important}#av-fixed-header{position:fixed;z-index:1000;top:0;left:0;right:0;height:64px;background:#fff;display:flex;align-items:center;padding:9px 10px;gap:10px;border-bottom:1px solid #ddd}.av-menu-btn{font-size:28px;border:0;background:transparent}.av-title{font-size:20px;font-weight:800;flex:1;text-align:center}.av-gps{font-size:12px}.av-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#20d84a}main{max-width:700px;margin:auto;padding:10px}#av-trip-panel{position:sticky;top:64px;z-index:50;background:var(--bg);padding:2px 0 7px}.av-trip-panel-inner{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 9px #0001;border:1px solid #ddd}.av-trip-panel-title{font-weight:800;text-align:center;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.av-expand-icon{transition:transform .15s}.av-dashboard{display:grid;grid-template-columns:1fr 1fr;gap:9px}.av-box{background:#fff;border:1px solid #dfe4e8;border-radius:13px;padding:8px;min-width:0}.av-box-label{font-size:11px;color:#59636f;font-weight:800}.av-box-value{font-size:21px;font-weight:900;margin-top:4px}.av-fuel-bars{display:grid;grid-template-columns:repeat(var(--fuel-bars-count,8),1fr);gap:3px;margin-top:8px}.av-fuel-bars span{height:8px;border-radius:3px;background:#aeb6bf;border:1px solid #89939e}.av-fuel-bars span.on{background:#16a34a;border-color:#0b7a35}.av-fuel-legend{display:flex;justify-content:space-between;font-size:11px;color:#59636f;margin-top:3px}#av-trip-panel.vehicle-collapsed .av-box{padding:6px}#av-trip-panel.vehicle-collapsed .av-box-label{font-size:10px}#av-trip-panel.vehicle-collapsed .av-box-value{font-size:18px}#av-trip-panel.vehicle-collapsed .av-fuel-legend{display:none}#av-trip-panel.vehicle-collapsed .av-fuel-bars{margin-top:5px}#av-trip-panel.vehicle-collapsed .av-expand-icon{transform:rotate(-90deg)}.av-compact-click{cursor:pointer}.card{background:var(--card);border:1px solid #d8dde3;border-radius:15px;padding:13px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{min-height:67px;background:#fff;border:1px solid #d8dde3;border-radius:12px;padding:9px}.metric span{font-size:12px;color:#59636f}.metric b{display:block;font-size:17px;margin-top:4px}#av-trip-footer{position:fixed;z-index:999;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7dce2;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.av-action{border:1px solid #d0d6dc;background:#fff;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800}.av-action.primary{background:#16a34a;color:#fff;border-color:#16a34a}.av-action.danger{background:#dc2626;color:#fff;border-color:#dc2626}@media(max-width:520px){.av-title{font-size:18px}}
</style></head><body><header id="av-fixed-header"><button class="av-menu-btn">☰</button><div class="av-title">Assistente de Viagem</div><div class="av-gps">GPS <span class="av-dot"></span></div></header><main><section id="av-trip-panel"><div class="av-trip-panel-inner"><div class="av-trip-panel-title" id="avVehiclePanelToggle" role="button" tabindex="0" aria-expanded="true">PAINEL DO VEÍCULO <span class="av-expand-icon">▼</span></div><div class="av-dashboard"><div class="av-box av-compact-click" id="avFuelBox"><div class="av-box-label">COMBUSTÍVEL</div><div class="av-box-value" id="avFuelValue">0 L</div><div class="av-fuel-bars" id="avFuelBars"></div><div class="av-fuel-legend"><span>Vazio</span><span>Cheio</span></div></div><div class="av-box av-compact-click" id="avOdoBox"><div class="av-box-label">ODÔMETRO</div><div class="av-box-value" id="avOdoValue">0 km</div></div></div></div></section><section class="card"><h3>Viagens</h3><div class="grid"><div class="metric"><span>Status</span><b>Pronto</b></div><div class="metric"><span>Destino</span><b>—</b></div></div></section></main><footer id="av-trip-footer"><button class="av-action primary">▶ Iniciar viagem</button><button class="av-action">⏸ Pausa</button><button class="av-action danger">⏹ Terminar viagem</button><button class="av-action">🆕 Nova viagem</button></footer><script>(function(){const p=document.getElementById('av-trip-panel'),t=document.getElementById('avVehiclePanelToggle'),f=document.getElementById('avFuelBox'),o=document.getElementById('avOdoBox');function c(v){p.classList.toggle('vehicle-collapsed',v);t.setAttribute('aria-expanded',String(!v));try{localStorage.setItem('av_vehicle_panel_collapsed',v?'1':'0')}catch(e){}}let x=false;try{x=localStorage.getItem('av_vehicle_panel_collapsed')==='1'}catch(e){}c(x);t.onclick=()=>c(!p.classList.contains('vehicle-collapsed'));t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click()}};f.onclick=()=>window.dispatchEvent(new CustomEvent('av-adjust-vehicle',{detail:{type:'fuel'}}));o.onclick=()=>window.dispatchEvent(new CustomEvent('av-adjust-vehicle',{detail:{type:'odometer'}}));window.avSetFuelBars=function(n,on){const b=document.getElementById('avFuelBars');n=Math.max(1,+n||8);on=Math.max(0,Math.min(n,+on||0));b.style.setProperty('--fuel-bars-count',n);b.innerHTML='';for(let i=0;i<n;i++){let s=document.createElement('span');if(i<on)s.className='on';b.appendChild(s)}};window.avSetFuelBars(8,0);window.avResetVehiclePanel=function(){c(false);try{localStorage.removeItem('av_vehicle_panel_collapsed')}catch(e){}}})();</script></body></html>
