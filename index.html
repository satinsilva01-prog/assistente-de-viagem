<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TESTE ISOLADO DO RESET</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827;padding:20px}.card{max-width:520px;margin:30px auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 20px #0001}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-size:16px;font-weight:700;background:#2563eb;color:#fff}.danger{background:#b91c1c}.value{padding:12px;background:#f8fafc;border-radius:10px;margin-top:10px}</style></head><body><div class="card"><h2>TESTE ISOLADO DO RESET</h2><p>APK criado somente para testar o reset dentro do WebView.</p><div class="value">Dado de teste: <b id="valor">0</b></div><button onclick="adicionar()">Adicionar dado de teste</button><button class="danger" onclick="resetApp()">♻️ RESETAR APLICATIVO</button><p id="status"></p></div><script>function salvar(){localStorage.setItem('teste_reset_valor',document.getElementById('valor').textContent)}function carregar(){document.getElementById('valor').textContent=localStorage.getItem('teste_reset_valor')||'0'}function adicionar(){let n=Number(document.getElementById('valor').textContent||0)+1;document.getElementById('valor').textContent=n;salvar();document.getElementById('status').textContent='Dado salvo no armazenamento local.'}function resetApp(){if(!confirm('Confirmar RESET?'))return;try{if(window.AndroidGPS&&typeof window.AndroidGPS.resetAll==='function')window.AndroidGPS.resetAll()}catch(e){}try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}try{if(window.indexedDB&&indexedDB.databases){indexedDB.databases().then(d=>d.forEach(x=>x&&x.name&&indexedDB.deleteDatabase(x.name))).catch(()=>{})}}catch(e){}document.getElementById('valor').textContent='0';document.getElementById('status').textContent='RESET executado. Recarregando...';setTimeout(()=>location.reload(),500)}carregar();</script></body></html>
