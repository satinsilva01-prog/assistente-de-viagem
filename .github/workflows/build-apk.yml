name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar INDEX oficial antes do APK
        run: |
          set -e
          test -f index.html
          python3 tools/fix_index.py
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          grep -q 'Assistente de Viagem V35' app/src/main/assets/index.html
          grep -q 'Histórico do veículo' app/src/main/assets/index.html
          grep -q 'function resetApp' app/src/main/assets/index.html
          grep -q 'viagem-simplificacao-2026-09-19' app/src/main/assets/index.html
          echo "INDEX oficial preparado: reset preservado, cadeado removido e painel não fixo"
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK
        run: gradle :app:assembleDebug
      - name: Validar APK gerado
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK gerado com sucesso"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
