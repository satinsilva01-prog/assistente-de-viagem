name: Gerar APK NOVO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código limpo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Limpar qualquer build anterior
        run: |
          set -euxo pipefail
          rm -rf app/build .gradle
          rm -f app/src/main/assets/index.html
          mkdir -p app/src/main/assets

      - name: Colocar o INDEX V35 atual dentro do APK
        run: |
          set -euxo pipefail
          test -s index.html
          cp -f index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          echo "=== INDEX DA RAIZ ==="
          wc -c index.html
          sha256sum index.html
          echo "=== INDEX COPIADO PARA O APK ==="
          wc -c app/src/main/assets/index.html
          sha256sum app/src/main/assets/index.html
          cmp -s index.html app/src/main/assets/index.html
          echo "CONFIRMADO: os dois INDEX são byte a byte iguais"
          grep -q 'Assistente de Viagem V35' index.html
          grep -q 'av-trip-panel' index.html
          grep -q 'function resetApp' index.html
          grep -q 'id="btnIniciar"' index.html
          grep -q 'id="abBarras"' index.html

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK totalmente novo
        run: |
          set -euxo pipefail
          gradle clean :app:assembleDebug --no-build-cache

      - name: Validar APK novo
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo "APK NOVO V35 VALIDADO"

      - name: Disponibilizar APK novo
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-V35-APK
          path: app/build/outputs/apk/debug/app-debug.apk
