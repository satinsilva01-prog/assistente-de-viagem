name: Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Corrigir reset no APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          new = r'''function resetApp(){
            if(!confirm('⚠️ Isso apagará todos os dados locais do aplicativo, incluindo viagens, abastecimentos, veículos, histórico, manutenção, ajustes, alertas e configurações. Deseja realmente resetar?'))return;
            try{stopGps()}catch(e){}
            try{stopTimer()}catch(e){}
            try{localStorage.clear()}catch(e){console.warn('localStorage.clear falhou',e)}
            try{sessionStorage.clear()}catch(e){console.warn('sessionStorage.clear falhou',e)}
            try{
              if(window.indexedDB&&indexedDB.databases){
                indexedDB.databases().then(dbs=>(dbs||[]).forEach(db=>{if(db&&db.name)try{indexedDB.deleteDatabase(db.name)}catch(e){}})).catch(()=>{});
              }
            }catch(e){}
            state=clone(DEFAULT);
            if(!Array.isArray(state.manutencoes))state.manutencoes=[];
            if(!Array.isArray(state.maintenanceTypes))state.maintenanceTypes=[];
            lastGps=null;lossStarted=null;currentSpeed=0;currentLimit=null;speedingSince=null;viagemTelaTravada=false;
            document.body.classList.remove('dark');
            if($('avThemeBtn'))$('avThemeBtn').textContent='🌙';
            try{setViagemTelaTravada(false)}catch(e){}
            try{if(window.AndroidGPS&&typeof window.AndroidGPS.resetAll==='function')window.AndroidGPS.resetAll();}catch(e){}
            try{location.replace(location.href.split('#')[0].split('?')[0]+'?reset='+Date.now())}catch(e){try{location.reload()}catch(e2){}}
          }
          '''
          s2, n = re.subn(r'function resetApp\(\)\{.*?\n\}\n(?=function openMenu\(\))', new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível localizar a rotina resetApp no index.html')
          p.write_text(s2, encoding='utf-8')
          print('Reset corrigido no arquivo do APK')
          PY

      - name: Compilar APK
        run: gradle :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
