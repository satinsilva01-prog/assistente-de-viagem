name: Teste isolado do RESET
on:
  push:
    branches: [teste-reset]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Copiar INDEX de teste
        run: |
          set -e
          test -f index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          grep -q 'TESTE ISOLADO DO RESET' app/src/main/assets/index.html
          grep -q 'function resetApp' app/src/main/assets/index.html
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK de teste
        run: gradle :app:assembleDebug
      - name: Validar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-TESTE-RESET
          path: app/build/outputs/apk/debug/app-debug.apk
