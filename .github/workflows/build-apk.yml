name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Sincronizar INDEX oficial
        run: |
          set -e
          test -f index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          grep -q 'Assistente de Viagem V35' app/src/main/assets/index.html
          grep -q 'Histórico do veículo' app/src/main/assets/index.html
          grep -q 'function resetApp' app/src/main/assets/index.html
          grep -q 'V35 FIX CADEADO RESET 2026-09-18' app/src/main/assets/index.html
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK
        run: gradle :app:assembleDebug
      - name: Validar APK gerado
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
