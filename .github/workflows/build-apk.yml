name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar arquivos oficiais para o APK
        run: |
          set -euxo pipefail
          test -s index.html
          test -s tomtom.js
          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html
          cp -f tomtom.js app/src/main/assets/tomtom.js
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/tomtom.js
          echo 'Validando que o INDEX não foi alterado pelo build'
          sha256sum index.html app/src/main/assets/index.html
          cmp -s index.html app/src/main/assets/index.html
          echo 'INDEX raiz e INDEX do APK são idênticos'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK
        run: |
          set -euxo pipefail
          gradle clean :app:assembleDebug --no-build-cache

      - name: Validar APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
