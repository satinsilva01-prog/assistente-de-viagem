name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir lógica da viagem no INDEX atual
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="state.trip={id:uid('trip'),schemaVersion:1,createdAt:new Date(now).toISOString(),updatedAt:new Date(now).toISOString(),vehicle:clone(state.vehicle),origin,destination,startedAt:now,endedAt:null,running:true,paused:false,pausedAt:null,pausedMs:0,distanceKm:0,correctedKm:0,liters:0,cost:0,lastPosition:null,avgSpeed:0,drivingMs:0,extra:{}};"
          new="state.trip={id:uid('trip'),schemaVersion:1,createdAt:new Date(now).toISOString(),updatedAt:new Date(now).toISOString(),vehicle:clone(state.vehicle),origin,destination,startedAt:now,endedAt:null,running:true,paused:false,pausedAt:null,pausedMs:0,distanceKm:0,correctedKm:0,liters:0,cost:0,lastPosition:null,avgSpeed:0,drivingMs:0,startFuelL:Number(state.vehicle.fuelL)||0,initialOdometer:Number(state.vehicle.odometerRef)||0,extra:{}};"
          if old not in s: raise SystemExit('initTrip pattern not found')
          s=s.replace(old,new,1)
          old="if(lossStarted&&gap>5000){const corrected=hav(lastGps,c);if(corrected>0&&corrected<50){state.trip.correctedKm=Number((state.trip.correctedKm+corrected).toFixed(3));state.trip.distanceKm=Number((state.trip.distanceKm+corrected).toFixed(3));state.trip.extra.lastGpsCorrection={from:lastGps,to:c,gapMs:gap,km:corrected,at:new Date(now).toISOString()};}}"
          new="if(lossStarted&&gap>5000){\n      const corrected=hav(lastGps,c);\n      const maxPlausibleKm=Math.max(0.35,180*(gap/3600000)+0.25);\n      if(corrected>0&&corrected<=maxPlausibleKm){\n        state.trip.correctedKm=Number((state.trip.correctedKm+corrected).toFixed(3));\n        state.trip.distanceKm=Number((state.trip.distanceKm+corrected).toFixed(3));\n        state.trip.extra.lastGpsCorrection={from:lastGps,to:c,gapMs:gap,km:corrected,accepted:true,at:new Date(now).toISOString()};\n      }else{\n        state.trip.extra.lastGpsCorrection={from:lastGps,to:c,gapMs:gap,km:corrected,accepted:false,reason:'salto_gps_nao_plausivel',at:new Date(now).toISOString()};\n      }\n    }"
          if old not in s: raise SystemExit('GPS tunnel pattern not found')
          s=s.replace(old,new,1)
          old="if(ref>0 && Number(state.vehicle.fuelL)>0){\n    state.vehicle.fuelL=Math.max(0,Number((state.vehicle.fuelL-d/ref).toFixed(3)));\n    if(v){v.fuelL=state.vehicle.fuelL;v.updatedAt=new Date().toISOString();}\n    if(state.trip.vehicle)state.trip.vehicle.fuelL=state.vehicle.fuelL;\n  }"
          new="if(ref>0 && Number(state.trip.startFuelL)>0){\n    const remaining=Math.max(0,Number((Number(state.trip.startFuelL)-Number(state.trip.liters||0)).toFixed(3)));\n    state.vehicle.fuelL=remaining;\n    if(v){v.fuelL=remaining;v.updatedAt=new Date().toISOString();}\n    if(state.trip.vehicle)state.trip.vehicle.fuelL=remaining;\n  }"
          if old not in s: raise SystemExit('fuel marker pattern not found')
          s=s.replace(old,new,1)
          old="  if(currentVehicle) state.vehicle=Object.assign(clone(DEFAULT.vehicle),clone(currentVehicle));\n  state.trip=null;"
          new="  if(currentVehicle) state.vehicle=Object.assign(clone(DEFAULT.vehicle),clone(currentVehicle));\n  state.vehicle=clone(DEFAULT.vehicle);\n  state.trip=null;"
          if old not in s: raise SystemExit('clearTrip pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('INDEX corrigido:',len(s),'bytes')
          PY

      - name: Preparar INDEX atual e TomTom
        run: |
          set -euxo pipefail
          test -s index.html
          test -s tomtom.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="tomtom.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker,tag+'\n'+marker,1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html
          cp -f tomtom.js app/src/main/assets/tomtom.js
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/tomtom.js
          echo "INDEX e TomTom preparados para o APK"
          wc -c index.html tomtom.js app/src/main/assets/index.html app/src/main/assets/tomtom.js
          sha256sum index.html tomtom.js app/src/main/assets/index.html app/src/main/assets/tomtom.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK
        run: |
          set -euxo pipefail
          gradle clean :app:assembleDebug --no-build-cache

      - name: Validar APK
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
