name: Gerar APK — limpo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK limpo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout limpo do main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Limpar qualquer artefato anterior
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/build build .gradle app/src/main/assets
          mkdir -p app/src/main/assets

      - name: Copiar somente os arquivos oficiais
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s tomtom.js

          cp --preserve=mode,timestamps index.html app/src/main/assets/index.html
          cp --preserve=mode,timestamps tomtom.js app/src/main/assets/tomtom.js

          echo "SOURCE_COMMIT=${GITHUB_SHA}" > app/src/main/assets/build-info.txt
          echo "SOURCE_INDEX_SHA256=$(sha256sum index.html | cut -d' ' -f1)" >> app/src/main/assets/build-info.txt
          echo "BUILD_RUN=${GITHUB_RUN_NUMBER}" >> app/src/main/assets/build-info.txt

          echo '--- arquivos fonte ---'
          sha256sum index.html tomtom.js
          echo '--- arquivos que irão para o APK ---'
          sha256sum app/src/main/assets/index.html app/src/main/assets/tomtom.js

          cmp -s index.html app/src/main/assets/index.html
          cmp -s tomtom.js app/src/main/assets/tomtom.js
          echo 'OK: as cópias para o APK são idênticas às fontes do main.'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar do zero
        shell: bash
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :app:assembleDebug --no-build-cache --rerun-tasks --stacktrace

      - name: Provar o conteúdo real do APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          echo '--- conteúdo do APK ---'
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'assets/tomtom.js'
          unzip -l "$APK" | grep -F 'assets/build-info.txt'

          rm -rf /tmp/apk-check
          mkdir -p /tmp/apk-check
          unzip -p "$APK" assets/index.html > /tmp/apk-check/index.html
          unzip -p "$APK" assets/tomtom.js > /tmp/apk-check/tomtom.js
          unzip -p "$APK" assets/build-info.txt > /tmp/apk-check/build-info.txt

          echo '--- SHA do INDEX da raiz ---'
          sha256sum index.html
          echo '--- SHA do INDEX dentro do APK ---'
          sha256sum /tmp/apk-check/index.html
          cmp -s index.html /tmp/apk-check/index.html

          echo '--- SHA do TomTom da raiz ---'
          sha256sum tomtom.js
          echo '--- SHA do TomTom dentro do APK ---'
          sha256sum /tmp/apk-check/tomtom.js
          cmp -s tomtom.js /tmp/apk-check/tomtom.js

          echo '--- identificação da build ---'
          cat /tmp/apk-check/build-info.txt

          echo 'CONFIRMADO: APK contém exatamente o INDEX e o TomTom do main.'
          sha256sum "$APK"

      - name: Publicar somente o APK desta execução
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK-main-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30