name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar arquivos oficiais para o APK
        run: |
          set -euxo pipefail
          test -s index.html
          test -s tomtom.js
          mkdir -p app/src/main/assets
          cp -f index.html app/src/main/assets/index.html
          cp -f tomtom.js app/src/main/assets/tomtom.js
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/tomtom.js
          echo 'Validando que o INDEX não foi alterado pelo build'
          sha256sum index.html app/src/main/assets/index.html
          cmp -s index.html app/src/main/assets/index.html
          echo 'INDEX raiz e INDEX do APK são idênticos'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Compilar APK
        run: |
          set -euxo pipefail
          gradle clean :app:assembleDebug --no-build-cache

      - name: Validar conteúdo real do APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/index.html'
          unzip -l "$APK" | grep -F 'assets/tomtom.js'
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          unzip -p "$APK" assets/tomtom.js > /tmp/apk-tomtom.js
          echo 'SHA do INDEX original:'
          sha256sum index.html
          echo 'SHA do INDEX realmente dentro do APK:'
          sha256sum /tmp/apk-index.html
          cmp -s index.html /tmp/apk-index.html
          echo 'CONFIRMADO: o INDEX dentro do APK é idêntico ao INDEX da raiz.'
          grep -F 'Limite da via' /tmp/apk-index.html || true
          grep -F '2.300' /tmp/apk-index.html || true
          sha256sum "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk