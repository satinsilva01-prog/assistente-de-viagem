name: Fix viagem UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix viagem UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção oficial no INDEX
        run: python3 tools/fix_index.py
      - name: Copiar INDEX para o APK
        run: |
          set -e
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          grep -q 'function resetApp' index.html
          grep -q 'viagem-simplificacao-2026-09-19' index.html
      - name: Commit correção oficial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app/src/main/assets/index.html
          git commit -m 'Fix viagem UI' || exit 0
          git push
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK corrigido
        run: gradle :app:assembleDebug
      - name: Validar APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK corrigido
        uses: actions/upload-artifact@v4
        with:
          name: Assistente-de-Viagem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
